<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada - Macabro Escape Room</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#070609;color:#e9e2d6;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:2rem}
  h1{font-family:'Times New Roman',serif;font-size:clamp(4rem,14vw,8rem);letter-spacing:.08em;margin:0 0 .2em;color:#e62533}
  p{color:#a89f93;max-width:34em;margin:0 auto 2rem}
  a{display:inline-block;padding:.95em 2.1em;background:linear-gradient(160deg,#e62533,#7c0a13);color:#fff;
    text-decoration:none;letter-spacing:.14em;text-transform:uppercase;font-weight:700;border-radius:3px}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <p>La página que buscas ha desaparecido… como el hermano Ezequiel.</p>
  <a id="volver" href="/">Volver al inicio</a>
</div>
<script>
/* En la URL de vista previa usuario.github.io/repo/ la raíz del sitio no es "/" */
if (location.hostname.endsWith('.github.io')) {
  var seg = location.pathname.split('/')[1];
  if (seg) document.getElementById('volver').href = '/' + seg + '/';
}
</script>
</body>
</html>
